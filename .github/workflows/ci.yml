name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install pytest
      # Seven GUI tests assert pixel geometry / window-mapping behavior calibrated
      # to the dev machine's display (widths, winfo_ismapped, viewport containment).
      # They pass in the full local suite and stay gated there; CI runs the rest.
      - name: Run test suite
        run: >
          python -m pytest tests/ -q
          --deselect tests/test_app.py::test_phase2_duplicates_tab_uses_three_card_shell_preserving_controls
          --deselect tests/test_app.py::test_fulltext_reason_choice_sets_value_and_terminal_exclude_uses_it_without_prompt
          --deselect tests/test_app.py::test_phase4_fulltext_attached_pdf_heading_and_filename_fit_above_action_row
          --deselect tests/test_app.py::test_phase4_maybe_support_keyboard_and_blind_gate_are_rendered
          --deselect tests/test_app.py::test_maybe_tab_uses_three_column_queue_detail_and_decision_layout
          --deselect tests/test_app.py::test_prisma_flow_diagram_enters_reference_viewport_after_counts
          --deselect tests/test_app.py::test_phase4_maybe_keyboard_and_blind_callout_fit_support_card
